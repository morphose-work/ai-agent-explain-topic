researcher_task: 
  description: >
    Проведи глубокий поиск информации по теме: {topic}.

    Найди:
    - Определение и ключевые термины
    - Основные принципы и как это работает
    - Актуальные данные и статистику
    - Практические примеры использования
    - Источники информации
    
    Особое внимание удели достоверности источников.
  expected_output: >
    Структурированные данные по теме с указанием источников.
    Включи: определение, ключевые понятия, факты, примеры.
  agent: researcher

teacher_task: 
  description: >
    На основе данных исследователя создай подробное объяснение темы: {topic}.

    Твой ответ должен включать:
    1. Название темы
    2. Краткое объяснение (2-3 предложения простыми словами)
    3. Основные термины и понятия (3-5 штук)
    4. Подробное объяснение сути: как работает и зачем нужно
    5. Практические примеры (минимум 3 примера)
    6. Итоговый вывод: главное, что нужно запомнить
    
    Пиши простым языком, используй аналогии из жизни.
  expected_output: >
    Готовое объяснение в формате Markdown с четкой структурой:
    - Заголовки разделов
    - Списки терминов
    - Примеры с пояснениями
    - Выделение важного жирным шрифтом
  agent: teacher
  context: [researcher_task]